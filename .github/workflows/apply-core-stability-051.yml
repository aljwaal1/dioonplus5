name: Apply Core Stability 0.5.1

on:
  push:
    branches: ["fix/core-stability-0.5.1"]
    paths:
      - "tools/apply_core_stability_051.py"
      - ".github/workflows/apply-core-stability-051.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-stability-0.5.1
      - run: python tools/apply_core_stability_051.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden core debt calculations and reminders"
          git push origin HEAD:fix/core-stability-0.5.1
