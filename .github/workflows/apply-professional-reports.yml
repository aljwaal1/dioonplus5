name: Apply Professional Reports

on:
  push:
    branches: ["feature/professional-reports"]
    paths:
      - "tools/apply_professional_reports.py"
      - ".github/workflows/apply-professional-reports.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/professional-reports

      - name: Apply report patch
        run: python tools/apply_professional_reports.py

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add professional filtered reports and owner statements"
          git push origin HEAD:feature/professional-reports
