name: Apply Due Payments Release

on:
  push:
    branches: ["feature/due-reminders-payments"]
    paths:
      - "tools/apply_due_payments_release.py"
      - ".github/workflows/apply-due-payments-release.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/due-reminders-payments
      - run: python tools/apply_due_payments_release.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add due reminders and partial payment tracking"
          git push origin HEAD:feature/due-reminders-payments
