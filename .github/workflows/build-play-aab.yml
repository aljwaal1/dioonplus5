name: Build Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIOON_KEYSTORE_PASSWORD: ${{ secrets.DIOON_KEYSTORE_PASSWORD }}
      DIOON_KEY_ALIAS: ${{ secrets.DIOON_KEY_ALIAS }}
      DIOON_KEY_PASSWORD: ${{ secrets.DIOON_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Validate signing secrets
        shell: bash
        run: |
          test -n "${{ secrets.DIOON_KEYSTORE_BASE64 }}" || (echo "Missing DIOON_KEYSTORE_BASE64" && exit 1)
          test -n "$DIOON_KEYSTORE_PASSWORD" || (echo "Missing DIOON_KEYSTORE_PASSWORD" && exit 1)
          test -n "$DIOON_KEY_ALIAS" || (echo "Missing DIOON_KEY_ALIAS" && exit 1)
          test -n "$DIOON_KEY_PASSWORD" || (echo "Missing DIOON_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        shell: bash
        run: echo "${{ secrets.DIOON_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB
        run: gradle --no-daemon --console=plain :app:bundleRelease

      - name: Rename AAB
        run: |
          mkdir -p release
          cp app/build/outputs/bundle/release/app-release.aab "release/DioonPlus-v${{ steps.version.outputs.name }}-play.aab"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DioonPlus-Google-Play-AAB
          path: release/DioonPlus-v${{ steps.version.outputs.name }}-play.aab
          if-no-files-found: error
          retention-days: 30
