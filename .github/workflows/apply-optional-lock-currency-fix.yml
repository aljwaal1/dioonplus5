name: Apply Optional Lock Currency Fix

on:
  push:
    branches: ["fix/optional-entry-lock-currency-input"]
    paths:
      - "tools/apply_optional_lock_currency_fix.py"
      - ".github/workflows/apply-optional-lock-currency-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/optional-entry-lock-currency-input
      - run: python tools/apply_optional_lock_currency_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optional entry lock and dynamic currency input"
          git push origin HEAD:fix/optional-entry-lock-currency-input
