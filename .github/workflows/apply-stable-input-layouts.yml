name: Apply Stable Input Layouts

on:
  push:
    branches: ["fix/stable-input-layouts"]
    paths:
      - "tools/apply_stable_input_layouts.py"
      - ".github/workflows/apply-stable-input-layouts.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stable-input-layouts
      - run: python tools/apply_stable_input_layouts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tools/apply_stable_input_layouts.py
          git rm tools/apply_stable_input_layouts.py
          git commit -m "Stabilize input forms without changing features"
          git push origin HEAD:fix/stable-input-layouts
