name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        id: apk_build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain :app:assembleDebug > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DioonPlus-Build-Log
          path: build.log
          if-no-files-found: error
          retention-days: 7

      - name: Show build error
        if: steps.apk_build.outputs.exit_code != '0'
        run: |
          tail -n 120 build.log
          exit 1

      - name: Rename APK
        if: steps.apk_build.outputs.exit_code == '0'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/DioonPlus-v${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload APK
        if: steps.apk_build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: DioonPlus-Android-APK
          path: release/DioonPlus-v${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error
          retention-days: 30
