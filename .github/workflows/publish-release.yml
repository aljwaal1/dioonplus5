name: Publish Android Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/DioonPlus-v${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          tag="v${VERSION}"
          apk="release/DioonPlus-v${VERSION}.apk"
          notes="نسخة وظيفية من ديون بلس: حفظ محلي للعملاء والموردين، حركات أعطيت وأخذت، حساب الأرصدة، تقارير فعلية، تصدير ومشاركة PDF، رمز PIN، ونسخ احتياطي واستعادة."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --title "ديون بلس $tag" --notes "$notes" --latest
          else
            gh release create "$tag" "$apk" --title "ديون بلس $tag" --notes "$notes" --latest
          fi
