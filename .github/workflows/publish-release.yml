name: Publish Android Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build release APK
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/DioonPlus-v0.1.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 release/DioonPlus-v0.1.0.apk --clobber
          else
            gh release create v0.1.0 release/DioonPlus-v0.1.0.apk \
              --title "ديون بلس v0.1.0" \
              --notes "نسخة أندرويد تجريبية أولية من ديون بلس. الواجهة عربية RTL وتحتوي على الرئيسية والتقارير والإعدادات ببيانات تجريبية."
          fi
