name: Apply Compact Add Button

on:
  push:
    branches: ["fix/stable-input-layouts"]
    paths:
      - "tools/shrink_add_party_fab.py"
      - ".github/workflows/apply-compact-add-button.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stable-input-layouts
      - run: python tools/shrink_add_party_fab.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/dioonplus/app/ui/screens/HomeScreen.kt
          git commit -m "Use compact add account button"
          git push origin HEAD:fix/stable-input-layouts
